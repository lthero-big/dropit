services:
  dropit:
    # Prebuilt image from Docker Hub. Upgrade with: docker compose pull && docker compose up -d
    image: ${DROPIT_IMAGE:-lthero1/dropit:latest}
    # Building from source still works and tags the result with the same name:
    #   DROPIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
    # (or ./scripts/update.sh --docker, which does git pull + rebuild + restart).
    build:
      context: .
      args:
        DROPIT_VERSION: ${DROPIT_VERSION:-}
        DROPIT_COMMIT: ${DROPIT_COMMIT:-}
        DROPIT_BUILD_DATE: ${DROPIT_BUILD_DATE:-}
        DROPIT_INSTALL: docker-build
    restart: unless-stopped
    labels:
      # Only containers with this label are touched by the optional watchtower service below.
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      # Loopback only. On a private LAN host, bind that address instead
      # (for example "192.168.1.152:8787:8787"). Do not publish 0.0.0.0.
      - "127.0.0.1:8787:8787"
    environment:
      # Local HTTP demo. For production use HTTPS origin + NODE_ENV=production.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "8787"
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
      DATA_DIR: /data
      STATIC_DIR: /app/public
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-26214400}
      USER_QUOTA_BYTES: ${USER_QUOTA_BYTES:-1073741824}
      RETENTION_HOURS: ${RETENTION_HOURS:-168}
      ROOM_MAX_FILE_BYTES: ${ROOM_MAX_FILE_BYTES:-5242880}
      ROOM_QUOTA_BYTES: ${ROOM_QUOTA_BYTES:-52428800}
      ROOM_RETENTION_HOURS: ${ROOM_RETENTION_HOURS:-24}
      SESSION_HOURS: ${SESSION_HOURS:-168}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-60000}
      MAX_TEXT_BYTES: ${MAX_TEXT_BYTES:-65536}
      MAX_ITEMS: ${MAX_ITEMS:-1000}
      RATE_WINDOW_MS: ${RATE_WINDOW_MS:-60000}
      RATE_GENERAL: ${RATE_GENERAL:-240}
      RATE_AUTH: ${RATE_AUTH:-20}
      RATE_INVITE: ${RATE_INVITE:-10}
      RATE_UPLOAD: ${RATE_UPLOAD:-30}
      RATE_ROOM: ${RATE_ROOM:-10}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Update check (admin → 更新). Set UPDATE_CHECK=false on offline hosts.
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      UPDATE_CHECK_HOURS: ${UPDATE_CHECK_HOURS:-12}
    volumes:
      - dropit-data:/data

  # Optional automatic updates, off by default. Start with:
  #   docker compose --profile autoupdate up -d
  # Watches only containers labelled com.centurylinklabs.watchtower.enable=true (dropit above)
  # and pulls lthero1/dropit:latest every 12 hours. nickfedor/watchtower is the maintained
  # fork; the original containrrr/watchtower is archived and fails on Docker 29+.
  watchtower:
    image: nickfedor/watchtower:latest
    profiles: ["autoupdate"]
    restart: unless-stopped
    command: --label-enable --cleanup --interval 43200
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dropit-data:
