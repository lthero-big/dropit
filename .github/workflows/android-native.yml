name: Android Native APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update GitHub Release (android-v<versionName>) with signed APK"
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "android-v*"
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
      - "scripts/publish-android-apk.mjs"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
      - "scripts/publish-android-apk.mjs"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && 'release-dispatch' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/android-v') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}

jobs:
  android-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
    outputs:
      version: ${{ steps.build-info.outputs.version }}
      version_code: ${{ steps.build-info.outputs.version_code }}
      short_sha: ${{ steps.build-info.outputs.short_sha }}
      build_commit: ${{ steps.build-info.outputs.build_commit }}
      build_date: ${{ steps.build-info.outputs.build_date }}
      signing_mode: ${{ steps.signing-key.outputs.signing_mode }}
      apk_name: ${{ steps.package-apk.outputs.apk_name }}
      apk_size: ${{ steps.package-apk.outputs.apk_size }}
      apk_sha256: ${{ steps.package-apk.outputs.apk_sha256 }}
      cert_sha256: ${{ steps.package-apk.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Build info & tag version check
        id: build-info
        working-directory: apps/android
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)
          SHORT="${SHA:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Failed to parse versionName/versionCode from apps/android/app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#android-v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (version '${TAG_VERSION}') does not match apps/android/app/build.gradle.kts versionName '${VERSION}'"
              exit 1
            fi
            echo "Verified release tag ${GITHUB_REF_NAME} matches versionName ${VERSION}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "DROPIT_BUILD_COMMIT=$SHA" >> "$GITHUB_ENV"
          echo "DROPIT_BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build_commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "Native build: version=$VERSION code=$VERSION_CODE commit=$SHORT date=$BUILD_DATE release=${IS_RELEASE}"
      # Same PKCS12 signing key as legacy Capacitor builds (ANDROID_KEYSTORE_B64), so native
      # 0.4.0 (code 6) installs directly over 0.3.2 (code 5) without uninstalling or losing data.
      - name: Signing key
        id: signing-key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dropit.p12"
            echo "DROPIT_KEYSTORE=$RUNNER_TEMP/dropit.p12" >> "$GITHUB_ENV"
            if [ -n "$KEYSTORE_PASSWORD" ]; then
              echo "::add-mask::$KEYSTORE_PASSWORD"
            fi
            echo "DROPIT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release-keystore (ANDROID_KEYSTORE_B64)" >> "$GITHUB_ENV"
            echo "signing_mode=release-keystore" >> "$GITHUB_OUTPUT"
          else
            if [ "${IS_RELEASE:-false}" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_B64 secret is required to publish a GitHub Release; refusing to use default-debug-keystore."
              exit 1
            fi
            echo "No ANDROID_KEYSTORE_B64 secret: using default debug key"
            echo "SIGNING_MODE=default-debug-keystore" >> "$GITHUB_ENV"
            echo "signing_mode=default-debug-keystore" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Install and build local dropit server for protocol regression
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dropit/server build
      - name: Run unit + real-server protocol regression tests and assemble APK
        run: |
          set -euo pipefail
          LIVE_DATA_DIR="$RUNNER_TEMP/dropit-live-data"
          LIVE_APK_SRC="$RUNNER_TEMP/dropit-update-test.apk"
          rm -rf "$LIVE_DATA_DIR"
          mkdir -p "$LIVE_DATA_DIR/app/android"

          # Create a deterministic fixture APK and publish it via scripts/publish-android-apk.mjs
          # so DefaultAppUpdater verifies the real server /api/app/android/latest & /download endpoints.
          printf 'PK\003\004dropit-protocol-regression-apk-%s\n' "$SHORT" > "$LIVE_APK_SRC"
          dd if=/dev/zero bs=1024 count=32 >> "$LIVE_APK_SRC" 2>/dev/null
          TEST_UPDATE_SHA="$(sha256sum "$LIVE_APK_SRC" | awk '{print $1}')"
          node scripts/publish-android-apk.mjs "$LIVE_APK_SRC" \
            --code 7 \
            --name 0.4.1 \
            --notes "CI protocol regression fixture release" \
            --dir "$LIVE_DATA_DIR/app/android"

          SERVER_LOG="$RUNNER_TEMP/dropit-live-server.log"
          HOST=127.0.0.1 \
          PORT=18787 \
          APP_ORIGIN=http://127.0.0.1:18787 \
          DATA_DIR="$LIVE_DATA_DIR" \
          ADMIN_EMAIL=regression@dropit.test \
          ADMIN_PASSWORD=DropitRegressionPass2026! \
          UPLOAD_CHUNK_BYTES=65536 \
          RATE_GENERAL=1000 \
          RATE_AUTH=100 \
          RATE_UPLOAD=200 \
          RATE_ROOM=50 \
          RATE_TOKEN=500 \
          DROPIT_VERSION="$VERSION" \
          DROPIT_COMMIT="$SHORT" \
          DROPIT_BUILD_DATE="$DROPIT_BUILD_DATE" \
          DROPIT_INSTALL=source \
          node apps/server/dist/index.js > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            rm -rf "$LIVE_DATA_DIR" "$LIVE_APK_SRC"
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18787/healthz >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Local dropit server exited prematurely:" >&2
              cat "$SERVER_LOG" >&2
              exit 1
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18787/healthz >/dev/null

          cd apps/android
          chmod +x gradlew
          DROPIT_LIVE_SERVER_URL=http://127.0.0.1:18787 \
          DROPIT_LIVE_ADMIN_EMAIL=regression@dropit.test \
          DROPIT_LIVE_ADMIN_PASSWORD=DropitRegressionPass2026! \
          DROPIT_LIVE_EXPECTED_UPDATE_VERSION=0.4.1 \
          DROPIT_LIVE_EXPECTED_UPDATE_CODE=7 \
          DROPIT_LIVE_EXPECTED_UPDATE_SHA256="$TEST_UPDATE_SHA" \
          DROPIT_REQUIRE_LIVE_SERVER=1 \
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Name APK, verify signature, compute SHA-256 & test publish script compatibility
        id: package-apk
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/dropit.p12"
          OUT_DIR="apps/android/out"
          APK_NAME="dropit-android-${VERSION}-${SHORT}.apk"
          APK_PATH="${OUT_DIR}/${APK_NAME}"
          mkdir -p "$OUT_DIR"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"

          APK_SIZE="$(wc -c < "$APK_PATH" | tr -d ' ')"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          (cd "$OUT_DIR" && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          cat "${APK_PATH}.sha256"

          # Verify APK signature and capture signer SHA-256 fingerprint
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          CERT_SHA256="unavailable"
          if [ -n "$APKSIGNER" ]; then
            SIGNER_OUT="$("$APKSIGNER" verify --print-certs "$APK_PATH")"
            echo "$SIGNER_OUT"
            CERT_SHA256="$(echo "$SIGNER_OUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]')"
          else
            if [ "${IS_RELEASE:-false}" = "true" ]; then
              echo "::error::apksigner not found under ANDROID_HOME; cannot verify signature for GitHub Release."
              exit 1
            fi
            echo "::warning::apksigner not found under ANDROID_HOME; skipped apksigner verify"
          fi

          if [ "${IS_RELEASE:-false}" = "true" ] && ! [[ "$CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Failed to capture valid 64-char signer certificate SHA-256 digest ('$CERT_SHA256') for GitHub Release."
            exit 1
          fi

          # Verify full compatibility with scripts/publish-android-apk.mjs against the real built APK
          PUB_DIR="$RUNNER_TEMP/publish-compat-check"
          rm -rf "$PUB_DIR"
          node scripts/publish-android-apk.mjs "$APK_PATH" \
            --code "$VERSION_CODE" \
            --name "$VERSION" \
            --notes "CI publish compatibility check ($SHORT)" \
            --dir "$PUB_DIR"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const m = JSON.parse(readFileSync(process.argv[1], 'utf8'));
            if (m.versionCode !== Number(process.argv[2])) throw new Error('versionCode mismatch');
            if (m.versionName !== process.argv[3]) throw new Error('versionName mismatch');
            if (m.sha256 !== process.argv[4]) throw new Error('sha256 mismatch');
            if (m.size !== Number(process.argv[5])) throw new Error('size mismatch');
            if (m.file !== 'dropit-android-' + process.argv[3] + '.apk') throw new Error('file mismatch');
            console.log('publish-android-apk.mjs compatibility verified:', JSON.stringify(m));
          " "$PUB_DIR/latest.json" "$VERSION_CODE" "$VERSION" "$APK_SHA256" "$APK_SIZE"
          rm -rf "$PUB_DIR"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "## Android Native APK Build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| APK File | \`${APK_NAME}\` |"
            echo "| Version | \`${VERSION}\` (code \`${VERSION_CODE}\`) |"
            echo "| Commit | \`${SHORT}\` |"
            echo "| Size | \`${APK_SIZE}\` bytes |"
            echo "| APK SHA-256 | \`${APK_SHA256}\` |"
            echo "| Signing Mode | \`${SIGNING_MODE}\` |"
            echo "| Signer Cert SHA-256 | \`${CERT_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dropit-android-apk
          path: |
            apps/android/out/*.apk
            apps/android/out/*.apk.sha256
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: android-native
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dropit-android-apk
          path: dist
      - name: Verify signing gate, checksum & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.android-native.outputs.version }}
          VERSION_CODE: ${{ needs.android-native.outputs.version_code }}
          SHORT: ${{ needs.android-native.outputs.short_sha }}
          BUILD_COMMIT: ${{ needs.android-native.outputs.build_commit }}
          BUILD_DATE: ${{ needs.android-native.outputs.build_date }}
          SIGNING_MODE: ${{ needs.android-native.outputs.signing_mode }}
          APK_NAME: ${{ needs.android-native.outputs.apk_name }}
          APK_SIZE: ${{ needs.android-native.outputs.apk_size }}
          APK_SHA256: ${{ needs.android-native.outputs.apk_sha256 }}
          CERT_SHA256: ${{ needs.android-native.outputs.cert_sha256 }}
        run: |
          set -euo pipefail

          # 1. Hard signing gate: never publish throwaway debug-key builds to GitHub Releases.
          if [ "$SIGNING_MODE" != "release-keystore" ]; then
            echo "::error::Refusing to publish GitHub Release: build used '${SIGNING_MODE:-unknown}' instead of ANDROID_KEYSTORE_B64 release keystore."
            exit 1
          fi
          if ! [[ "$CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Refusing to publish GitHub Release: missing valid signer certificate SHA-256 fingerprint ('${CERT_SHA256:-empty}')."
            exit 1
          fi

          # 2. Verify release tag matches built versionName.
          RELEASE_TAG="android-v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]] && [[ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match built release tag '${RELEASE_TAG}'."
            exit 1
          fi

          # 3. Verify downloaded artifact integrity with sha256sum -c and cross-check build output.
          APK_FILE="dist/${APK_NAME}"
          SHA_FILE="dist/${APK_NAME}.sha256"
          if [ ! -f "$APK_FILE" ] || [ ! -f "$SHA_FILE" ]; then
            echo "::error::Expected release artifacts missing under dist/: ${APK_NAME} and ${APK_NAME}.sha256"
            ls -la dist/ || true
            exit 1
          fi
          (cd dist && sha256sum -c "${APK_NAME}.sha256")
          ACTUAL_SHA256="$(sha256sum "$APK_FILE" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$APK_SHA256" ]; then
            echo "::error::Downloaded APK SHA-256 (${ACTUAL_SHA256}) does not match build output (${APK_SHA256})."
            exit 1
          fi

          # 4. Generate Release title and Release Notes.
          RELEASE_TITLE="dropit Android v${VERSION} (code ${VERSION_CODE})"
          APK_SIZE_MIB="$(awk -v bytes="$APK_SIZE" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## dropit Android 原生客户端 v${VERSION} (code ${VERSION_CODE})

          纯 Kotlin + Jetpack Compose 原生 Android 客户端正式构建，使用仓库固定发布密钥（\`ANDROID_KEYSTORE_B64\`）签名。

          ### 构建与校验信息

          | 项目 | 值 |
          | --- | --- |
          | 版本号 (\`versionName\`) | \`${VERSION}\` |
          | 版本号 (\`versionCode\`) | \`${VERSION_CODE}\` |
          | 构建 Commit | \`${SHORT}\` (\`${BUILD_COMMIT}\`) |
          | 构建时间 (UTC) | \`${BUILD_DATE}\` |
          | APK 文件 | \`${APK_NAME}\` |
          | 文件大小 | \`${APK_SIZE}\` bytes (${APK_SIZE_MIB}) |
          | APK SHA-256 | \`${APK_SHA256}\` |
          | 签名模式 | \`release-keystore (ANDROID_KEYSTORE_B64)\` |
          | 签名证书 SHA-256 指纹 | \`${CERT_SHA256}\` |

          ### 旧版覆盖升级说明

          - **可直接覆盖安装（切勿先卸载）**：本安装包与旧版 Capacitor（\`0.3.2 / code 5\`）及历史原生发布版使用相同的包名（\`dev.dropit.app\`）与固定签名证书，支持直接覆盖安装。
          - **保留登录态与数据**：从旧版 \`0.3.2 (code 5)\` 升级后，首次冷启动将自动幂等迁移服务器地址、设备 ID 与加密登录令牌，无需重新走设备码登录。
          - **ADB 覆盖安装示例**：
            \`\`\`bash
            adb install -r ${APK_NAME}
            \`\`\`

          ### 完整性与签名校验命令

          下载本页附件中的 \`${APK_NAME}\` 与 \`${APK_NAME}.sha256\` 后，可执行以下命令校验：

          \`\`\`bash
          # 1. 校验 APK 文件 SHA-256
          sha256sum -c ${APK_NAME}.sha256

          # 2. 校验 APK 签名证书指纹（应与上表「签名证书 SHA-256 指纹」完全一致）
          apksigner verify --verbose --print-certs ${APK_NAME}
          \`\`\`

          > 自托管部署管理员如需同步推送至服务端应用内更新（\`/api/app/android/latest\`），请使用同一份 APK 执行 \`scripts/publish-android-apk.mjs\`，详见 \`docs/android-native-release.md\`。
          EOF

          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi

          # 5. Idempotently create or update GitHub Release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; updating assets and release notes..."
            gh release upload "$RELEASE_TAG" "$APK_FILE" "$SHA_FILE" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              ${PRERELEASE_FLAG[@]+"${PRERELEASE_FLAG[@]}"}

            # Clean up stale APK/SHA-256 assets from earlier commits on the same version tag.
            EXISTING_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' || true)"
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              if [[ "$asset" == dropit-android-*.apk || "$asset" == dropit-android-*.apk.sha256 ]]; then
                if [ "$asset" != "$APK_NAME" ] && [ "$asset" != "${APK_NAME}.sha256" ]; then
                  echo "Removing stale release asset: ${asset}"
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                fi
              fi
            done <<< "$EXISTING_ASSETS"
          else
            echo "Creating GitHub Release ${RELEASE_TAG}..."
            gh release create "$RELEASE_TAG" "$APK_FILE" "$SHA_FILE" \
              --target "$BUILD_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              ${PRERELEASE_FLAG[@]+"${PRERELEASE_FLAG[@]}"}
          fi

          RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          echo "Published GitHub Release: ${RELEASE_URL}"
          {
            echo "## Android Native GitHub Release"
            echo ""
            echo "- **Release**: [${RELEASE_TITLE}](${RELEASE_URL})"
            echo "- **Tag**: \`${RELEASE_TAG}\`"
            echo "- **Assets**: \`${APK_NAME}\`, \`${APK_NAME}.sha256\`"
            echo "- **APK SHA-256**: \`${APK_SHA256}\`"
            echo "- **Signer Cert SHA-256**: \`${CERT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
