name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history: the version is the newest vX.Y.Z tag + commits since it
      - name: build metadata
        run: |
          echo "DROPIT_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "DROPIT_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "DROPIT_VERSION=$(sh scripts/release-version.sh)" >> "$GITHUB_ENV"
      - run: >-
          docker build -t dropit:ci
          --build-arg DROPIT_COMMIT --build-arg DROPIT_BUILD_DATE --build-arg DROPIT_VERSION .
      - name: image reports its build
        run: |
          docker image inspect dropit:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -qx "$DROPIT_COMMIT"
          docker image inspect dropit:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' | grep -qxF "$DROPIT_VERSION"
          docker run --rm dropit:ci node -e "import('./dist/version.js').then(m=>{const b=m.loadBuildInfo(process.env,null);console.log(JSON.stringify(b));if(b.commit!==process.env.DROPIT_COMMIT||b.version!==process.env.DROPIT_VERSION||b.install!=='docker')process.exit(1)})"

  publish:
    name: publish image
    # Pushes lthero1/dropit:latest + :<short-hash> from main, and :<version> from v* tags.
    # Skipped unless the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets exist.
    needs: [verify, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      HAS_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: lthero1/dropit
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_HUB == 'true'
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        if: env.HAS_HUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push
        if: env.HAS_HUB == 'true'
        run: |
          commit=$(git rev-parse --short=7 HEAD)
          # RHEA-192 m17: e.g. 0.1.0+20 (20 commits after v0.1.0); exactly 0.2.0 on the v0.2.0 tag.
          version=$(sh scripts/release-version.sh)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          args=(--build-arg DROPIT_COMMIT="$commit" --build-arg DROPIT_VERSION="$version" --build-arg DROPIT_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          tags=(-t "$IMAGE:$commit")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$IMAGE:$version"); fi
          tags+=(-t "$IMAGE:latest")
          docker build "${args[@]}" "${tags[@]}" .
          for tag in "${tags[@]}"; do [[ "$tag" == -t ]] || docker push "$tag"; done
