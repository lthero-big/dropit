name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust fmt, clippy, build, HTTP compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 is required because the compatibility harness archives
      # the fixed TS reference commit from the local Git object database.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/server -> target
          cache-on-failure: true
      - name: install dav1d
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdav1d-dev
          pkg-config --exists 'dav1d >= 1.3.0'
          pkg-config --modversion dav1d
      - name: verify compatibility inputs
        working-directory: rust/server
        run: |
          test "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" = "1.94.0"
          git cat-file -e 37ce06ebfab2cd98b81e49ce54fb24ec5daeec68^{commit}
          command -v cc
          command -v pkg-config
          pkg-config --exists 'dav1d >= 1.3.0'
          command -v git
          command -v tar
          node --version
          pnpm --version
          rustc --version
      - name: cargo fmt
        working-directory: rust/server
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: rust/server
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo build
        working-directory: rust/server
        run: cargo build --locked
      - name: TS/Rust HTTP compatibility
        working-directory: rust/server
        run: cargo test --locked -- --nocapture

  image:
    name: docker image
    needs: [verify, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history: the version is the newest vX.Y.Z tag + commits since it
      - name: build metadata
        run: |
          echo "DROPIT_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "DROPIT_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "DROPIT_VERSION=$(sh scripts/release-version.sh)" >> "$GITHUB_ENV"
      - run: >-
          docker build -t dropit:ci
          --build-arg DROPIT_COMMIT --build-arg DROPIT_BUILD_DATE --build-arg DROPIT_VERSION .
      - name: image reports its build
        run: |
          docker image inspect dropit:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -qx "$DROPIT_COMMIT"
          docker image inspect dropit:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' | grep -qxF "$DROPIT_VERSION"
          docker run --rm dropit:ci node -e "import('./dist/version.js').then(m=>{const b=m.loadBuildInfo(process.env,null);console.log(JSON.stringify(b));if(b.commit!==process.env.DROPIT_COMMIT||b.version!==process.env.DROPIT_VERSION||b.install!=='docker')process.exit(1)})"

  publish:
    name: publish image
    # Pushes lthero1/dropit:latest + :<short-hash> from main, and :<version> from v* tags.
    # Skipped unless the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets exist.
    needs: [verify, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      HAS_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: lthero1/dropit
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_HUB == 'true'
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        if: env.HAS_HUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push
        if: env.HAS_HUB == 'true'
        run: |
          commit=$(git rev-parse --short=7 HEAD)
          # RHEA-192 m17: e.g. 0.1.0+20 (20 commits after v0.1.0); exactly 0.2.0 on the v0.2.0 tag.
          version=$(sh scripts/release-version.sh)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          args=(--build-arg DROPIT_COMMIT="$commit" --build-arg DROPIT_VERSION="$version" --build-arg DROPIT_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          tags=(-t "$IMAGE:$commit")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$IMAGE:$version"); fi
          tags+=(-t "$IMAGE:latest")
          docker build "${args[@]}" "${tags[@]}" .
          for tag in "${tags[@]}"; do [[ "$tag" == -t ]] || docker push "$tag"; done
