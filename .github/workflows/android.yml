# Legacy Capacitor Android APK workflow (0.3.x rollback only).
# Since 0.4.0 (versionCode 6), the default Android build & release pipeline is
# `.github/workflows/android-native.yml` (pure Kotlin + Jetpack Compose in `apps/android/`).
# This workflow is kept solely for emergency Capacitor rollback builds or maintenance under `mobile/`.
name: Android Legacy APK (Capacitor Rollback)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
      # RHEA-190 fx: stamp the commit into the app (shown on its setup/settings pages).
      - name: Build info
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT=${SHA:0:7}" >> "$GITHUB_ENV"
          printf "export const BUILD = { version: '%s', code: %s, commit: '%s', date: '%s' };\n" "$VERSION" "$CODE" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > www/build-info.js
          cat www/build-info.js
      - run: npx cap sync android
      # Same signing key for every build (repo secret), so a new APK installs over the previous one.
      # Without the secret (forks) Gradle falls back to the runner's throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dropit.p12"
            echo "DROPIT_KEYSTORE=$RUNNER_TEMP/dropit.p12" >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "DROPIT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_B64 secret: using a throwaway debug key"
          fi
      - run: chmod +x android/gradlew && cd android && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Name the APK and compute SHA-256
        run: |
          mkdir -p out
          APK_NAME="dropit-android-${VERSION}-${SHORT}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${APK_NAME}"
          (cd out && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          cat "out/${APK_NAME}.sha256"
          rm -f "$RUNNER_TEMP/dropit.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: dropit-android-legacy-debug-apk
          path: |
            mobile/out/*.apk
            mobile/out/*.apk.sha256
          retention-days: 30
